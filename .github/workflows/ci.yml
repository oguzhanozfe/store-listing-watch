name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest -v
      - name: Timeline renders from the committed database
        run: python -m listingwatch --db data/listings.sqlite timeline --out /tmp/timeline && test -f /tmp/timeline/index.html
